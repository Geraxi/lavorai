name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Generate Prisma
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://ci_user:ci_password@localhost:5432/ci_db"
          DIRECT_URL: "postgresql://ci_user:ci_password@localhost:5432/ci_db"

      - name: Synthetic candidate autofill browser regression
        run: |
          npx playwright install --with-deps chromium
          npm run test:candidate-autofill

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Advertising consent and signup conversion regressions
        run: npm run test:google-ads && npm run test:meta-consent && npm run test:google-auth

      - name: Credit retry and worker safety tests
        run: npm run test:credit-retry && npm run test:worker-gates

      - name: Application lifecycle, duplicate prevention and retry rules
        run: npm run test:application-lifecycle && npm run test:reliability-metrics

      - name: Auto-apply quality regressions
        run: npm run test:auto-apply-quality

      - name: Paused ordinary validation and release controls
        run: npm run test:release-controls

      - name: Manual-only rollout and producer regressions
        run: npm run test:manual-rollout

      - name: Atomic global submission budget PostgreSQL integration
        env:
          PGPASSWORD: ci_password
          MANUAL_ROLLOUT_TEST_DATABASE_URL: "postgresql://ci_user:ci_password@127.0.0.1:5432/lavorai_manual_rollout_test?connection_limit=24"
        run: |
          psql -h 127.0.0.1 -U ci_user -d ci_db -c 'CREATE DATABASE lavorai_manual_rollout_test'
          npm run test:manual-rollout-postgres

      - name: Send and reply safety regressions
        run: npm run test:send-reply

      - name: Gmail sync progress PostgreSQL (fake providers only)
        env:
          PGPASSWORD: ci_password
          GMAIL_TEST_DATABASE_URL: "postgresql://ci_user:ci_password@127.0.0.1:5432/lavorai_gmail_test?connection_limit=16"
        run: |
          psql -h 127.0.0.1 -U ci_user -d ci_db -c 'CREATE DATABASE lavorai_gmail_test'
          npm run test:gmail-sync-postgres

      - name: Durable send/reply PostgreSQL integration
        env:
          PGPASSWORD: ci_password
          SEND_REPLY_TEST_DATABASE_URL: "postgresql://ci_user:ci_password@127.0.0.1:5432/lavorai_send_reply_test?connection_limit=16"
        run: |
          psql -h 127.0.0.1 -U ci_user -d ci_db -c 'CREATE DATABASE lavorai_send_reply_test'
          npm run test:send-reply-postgres

      - name: ATS test claim PostgreSQL concurrency
        env:
          PGPASSWORD: ci_password
          ATS_TEST_CLAIM_DATABASE_URL: "postgresql://ci_user:ci_password@127.0.0.1:5432/lavorai_ats_test_claim_test?connection_limit=16"
        run: |
          psql -h 127.0.0.1 -U ci_user -d ci_db -c 'CREATE DATABASE lavorai_ats_test_claim_test'
          npm run test:ats-test-claim-postgres

      - name: ATS test end-to-end fake Recruitee PostgreSQL
        env:
          PGPASSWORD: ci_password
          ATS_TEST_E2E_DATABASE_URL: "postgresql://ci_user:ci_password@127.0.0.1:5432/lavorai_ats_test_e2e_test?connection_limit=16"
        run: |
          psql -h 127.0.0.1 -U ci_user -d ci_db -c 'CREATE DATABASE lavorai_ats_test_e2e_test'
          npm run test:ats-test-e2e-postgres

      - name: Ordinary customer pipeline with local fake providers
        env:
          PGPASSWORD: ci_password
          ORDINARY_TEST_DATABASE_URL: "postgresql://ci_user:ci_password@127.0.0.1:5432/lavorai_ordinary_test?connection_limit=16"
        run: |
          psql -h 127.0.0.1 -U ci_user -d ci_db -c 'CREATE DATABASE lavorai_ordinary_test'
          npm run test:ordinary-pipeline-postgres

      - name: Catalogue policy and publication migration (fixtures only)
        env:
          PGPASSWORD: ci_password
          CATALOGUE_TEST_DATABASE_URL: "postgresql://ci_user:ci_password@127.0.0.1:5432/lavorai_catalogue_test"
        run: |
          psql -h 127.0.0.1 -U ci_user -d ci_db -c 'CREATE DATABASE lavorai_catalogue_test'
          npm run test:job-catalogue
          npm run test:job-catalogue-postgres

      - name: MCP protocol tests
        run: npm run test:mcp

      - name: Lint
        run: npm run lint

      - name: Push Prisma schema
        run: npx prisma db push --skip-generate --accept-data-loss
        env:
          DATABASE_URL: "postgresql://ci_user:ci_password@localhost:5432/ci_db"
          DIRECT_URL: "postgresql://ci_user:ci_password@localhost:5432/ci_db"

      - name: Build
        env:
          DATABASE_URL: "postgresql://ci_user:ci_password@localhost:5432/ci_db"
          DIRECT_URL: "postgresql://ci_user:ci_password@localhost:5432/ci_db"
          AUTH_SECRET: ci-dummy-secret-for-build-only-ci-dummy-secret
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: npx next build
